name: CI

# 合并门禁：类型、lint、构建三件事都在 PR 上跑。
#
# 原先没有任何 CI，`bun run check` 只在提交者本机跑，谁跳过谁就绿。
# 这里只做验证，不部署 —— 部署仍走 Cloudflare Pages 自己的 Git 集成。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 锁文件在库里，--frozen-lockfile 才能挡住「本地装了但没提交」
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bunx biome check src scripts

      # 暗色写了两份（跟随系统 / 手动选），这个脚本把两份不一致变成红灯
      - name: Theme parity
        run: bun run check:theme

      # 构建会抓 blog.30hb.cn：src/lib/http.ts 已带 IPv4 优先 + 退避重试，
      # 仍失败就说明上游真挂了，让它红是想要的信号
      - name: Build
        run: bun run build
