name: CI

# 合并门禁：bun run check 的全部闸门 + 构建，都在 PR 上跑。
#
# 原先没有任何 CI，`bun run check` 只在提交者本机跑，谁跳过谁就绿。
# 这里只做验证，不部署 —— 部署仍走 Cloudflare Pages 自己的 Git 集成。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # 只读仓库内容，别的都不需要；不写就会拿到默认的宽权限
    permissions:
      contents: read
    steps:
      # 两个 action 都按 commit SHA 钉死，tag 被挪走也换不掉跑的东西。
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      # 锁文件在库里，--frozen-lockfile 才能挡住「本地装了但没提交」
      - name: Install
        run: bun install --frozen-lockfile

      # 直接跑 bun run check，别在这里逐条抄：原先抄了
      # typecheck / biome / theme / cmp，却漏掉 spacing 和
      # deprecations —— 本地拦得住、CI 放过。
      - name: Checks
        run: bun run check

      # 构建会抓 blog.30hb.cn：src/lib/http.ts 已带 IPv4 优先 + 退避重试，
      # 仍失败就说明上游真挂了，让它红是想要的信号
      - name: Build
        run: bun run build
