name: Probe WP

# 一次性探针：CI runner 上 blog.30hb.cn 的 WP API 返回 403，本地复现不了。
# 目的：拿到 403 的响应头和响应体，判断是 Cloudflare 拦截还是插件拦 UA。
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  U: >-
    https://blog.30hb.cn/wp-json/wp/v2/posts?per_page=1&_embed

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: curl 各 UA 状态码
        continue-on-error: true
        run: |
          for ua in "" undici curl/8.5.0 "Mozilla/5.0 (X11; Linux x86_64)"; do
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
              --max-time 25 -A "$ua" "$U" || echo ERR)
            echo "=== ua=[$ua] code=$code"
            head -c 300 /tmp/body.txt
            echo
          done

      - name: 完整响应头（空 UA）
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -D - --max-time 25 -A "" "$U" || true

      - name: undici 直连
        continue-on-error: true
        run: |
          node -e '
            const u = process.env.U
            fetch(u).then(async r => {
              console.log("status", r.status)
              for (const [k, v] of r.headers) console.log(k, "=", v)
              console.log((await r.text()).slice(0, 400))
            }).catch(e => console.log("THROW", e.cause?.message || e.message))
          '

      - name: 出口 IP 与 DNS
        continue-on-error: true
        run: |
          curl -sS --max-time 15 https://api.ipify.org
          echo
          getent hosts blog.30hb.cn || true
